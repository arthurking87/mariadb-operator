apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-operator-ui
  namespace: test1
  labels:
    app.kubernetes.io/name: mariadb-operator-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb-operator-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb-operator-ui
    spec:
      # Reuses the operator's ServiceAccount; see rbac-core.yaml for the extra
      # permissions (namespaces, secrets get) the UI needs on top of it.
      serviceAccountName: mariadb-operator
      containers:
        - name: ui
          image: mariadb-operator-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: HELM_RELEASE_NAME
              value: mariadb-operator
            - name: HELM_RELEASE_NAMESPACE
              value: test1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-operator-ui
  namespace: test1
  labels:
    app.kubernetes.io/name: mariadb-operator-ui
spec:
  selector:
    app.kubernetes.io/name: mariadb-operator-ui
  ports:
    - port: 80
      targetPort: 3001
  type: ClusterIP
